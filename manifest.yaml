name: worldline-choice
version: 4.6.0
description: AI驱动互动叙事游戏引擎 v4.6.0 - DC校准与收益版。支持LLM驱动的意图识别和d20客观检定，新增DC校准体系（简单2-7/中等8-12/困难13-17）、收益与DC严格对应、统一存档系统（单文件game.json+事件压缩）、完整NPC关系系统。
author: Worldline Team
license: MIT

entry: worldline_skill.py
runtime: python3

scripts:
  main: worldline_skill.py

commands:
  - name: worldline
    description: Start a Worldline Choice game session
    script: worldline_skill.py
    args:
      - name: world
        flag: --world
        description: Game world setting (e.g., cyberpunk, fantasy, historical)
      - name: role
        flag: --role
        description: Player character role
      - name: name
        flag: --name
        description: Player character name

dependencies:
  - python >= 3.8

cache:
  enabled: false
